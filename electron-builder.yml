# 두레를 macOS 앱으로 묶는다. `pnpm run pack:mac` 으로 만든다 (결과는 dist/).
# pack:mac 은 서명·공증 없이 만든다 (Apple 개발자 계정이 없어도 된다. 받는 사람은 처음 열 때 한 번 허용해야 한다).
# pack:mac:signed 는 Developer ID 로 서명하고 공증한다 (docs/packaging.md).
appId: dev.dure.app
# 파일 이름은 영문으로 둔다: 한글 이름으로 묶으면 Electron 45 가 시작하자마자 죽는다 (실측). 화면에 보이는 이름은 아래 CFBundleDisplayName 이다.
productName: Dure
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# 네이티브 모듈은 묶음(asar) 밖에 둔다: SQLite 와 터미널(node-pty 의 spawn-helper)은 파일로 있어야 돈다.
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
npmRebuild: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
    - target: zip
  artifactName: dure-${version}-${arch}.${ext}
  # 서명은 명령에서 정한다 (package.json 의 pack:mac 은 임시 서명, pack:mac:signed 는 Developer ID 서명과 공증).
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    CFBundleDisplayName: 두레
    # 다른 사람의 두레와 같은 네트워크에서 직접 연결할 때 macOS 가 보여 주는 설명
    NSLocalNetworkUsageDescription: 같은 네트워크에 있는 다른 사람의 두레를 찾고 연결합니다. 설정에서 "다른 사람과 연결" 을 켰을 때만 씁니다.
    NSBonjourServices:
      - _dure._tcp
    # 근무시간: 근무지의 와이파이 이름을 읽으려면 macOS 의 위치 권한이 있어야 한다 (사용자가 요청했을 때만 묻는다)
    NSLocationUsageDescription: 근무지의 와이파이 이름을 알아보는 데 씁니다 (근무시간 재기). 위치 자체는 쓰지 않습니다.
    NSLocationWhenInUseUsageDescription: 근무지의 와이파이 이름을 알아보는 데 씁니다 (근무시간 재기). 위치 자체는 쓰지 않습니다.
    LSMinimumSystemVersion: "12.0"
dmg:
  title: Dure ${version}
publish: null
